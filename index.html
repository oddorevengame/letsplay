<!-- Inline SVG favicon — a simple O|E mark in the brand colors -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0e10'/%3E%3Crect width='16' height='32' fill='%23ff5b3a'/%3E%3Crect x='16' width='16' height='32' fill='%234ad6c0'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --ink: #f5f1e8;
    --paper: #f5f1e8;
    --odd: #ff5b3a;     /* warm red-orange */
    --even: #4ad6c0;    /* cool teal */
    --dim: #6a6a72;
    --rule: #1c1c20;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    overscroll-behavior: none;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  /* Lock the body to viewport height ONLY when the play screen is active,
     so tapping during play doesn't scroll. End screen with a tall grid
     needs to scroll naturally. */
  body.play-active {
    overflow: hidden;
    height: 100dvh;
  }

  /* subtle grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image:
      radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: screen;
    z-index: 100;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  /* When play is active, lock the app to viewport — no scroll past timer/buttons */
  body.play-active .app {
    height: 100dvh;
    min-height: 100dvh;
  }

  /* ============ SCREENS ============ */
  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    padding: 24px;
  }
  .screen.active { display: flex; }

  /* ============ START ============ */
  #start-screen {
    justify-content: space-between;
    text-align: left;
    min-height: 100dvh;
  }

  .title-block {
    margin-top: 12vh;
  }

  .title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(72px, 20vw, 132px);
    line-height: 0.85;
    letter-spacing: -0.02em;
  }
  .title .fudgy-word { color: var(--ink); }
  .title .maths-word { color: var(--ink); position: relative; display: inline-block; }
  .title .beta-tag {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--dim);
    vertical-align: super;
    margin-left: 0.15em;
    position: relative;
    top: -0.4em;
  }

  .subtitle {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .subtitle .odd-mini { color: var(--odd); font-weight: 700; }
  .subtitle .even-mini { color: var(--even); font-weight: 700; }

  .tagline {
    margin-top: 28px;
    font-size: 13px;
    color: var(--dim);
    max-width: 280px;
    line-height: 1.5;
  }
  .tagline strong { color: var(--ink); font-weight: 700; }

  .start-btn {
    background: var(--paper);
    color: var(--bg);
    border: none;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: 0.04em;
    padding: 24px;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
    transition: transform 0.08s ease;
    margin-bottom: 12px;
  }
  .start-btn:active { transform: scale(0.98); }

  .start-foot {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    margin-bottom: 12px;
    border: 1px solid var(--rule);
  }
  .mode-btn {
    background: transparent;
    color: var(--dim);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.25em;
    padding: 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }
  .mode-btn.active {
    background: var(--ink);
    color: var(--bg);
  }
  .mode-btn:not(.active):hover {
    color: var(--ink);
  }

  /* ============ PLAY ============ */
  #play-screen { padding: 0; }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .hud-item { display: flex; flex-direction: column; gap: 2px; }
  .hud-label {
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .hud-value {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 28px;
    line-height: 1;
  }
  .hud-value.score { text-align: right; }
  #timer-value.warn { color: var(--odd); animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .timer-bar {
    height: 3px;
    background: var(--rule);
    margin: 0 24px;
    position: relative;
    overflow: hidden;
  }
  .timer-bar-fill {
    position: absolute;
    inset: 0 0 0 0;
    background: var(--ink);
    transform-origin: left;
    transform: scaleX(1);
  }

  .question-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }

  .question {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(56px, 18vw, 130px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    text-align: center;
    /* Wrap long spelled-out / emoji equations gracefully */
    overflow-wrap: break-word;
    word-break: normal;
    max-width: 100%;
    padding: 0 8px;
  }
  /* Apply a smaller font automatically when the question gets long.
     Driven by a data attribute set in JS based on character count. */
  .question[data-len="long"]   { font-size: clamp(40px, 12vw, 84px); }
  .question[data-len="xlong"]  { font-size: clamp(32px, 9vw, 64px); }
  /* Wrong-answer shake: motion only, no color flash. Brief but unmissable
     so players can't accidentally miss a wrong tap. */
  .question.shake {
    animation: questionShake 0.32s ease;
  }
  @keyframes questionShake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-10px); }
    40%      { transform: translateX(10px); }
    60%      { transform: translateX(-7px); }
    80%      { transform: translateX(7px); }
  }

  .answer-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: 30vh;
    min-height: 180px;
  }
  .answer-btn {
    border: none;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(36px, 10vw, 56px);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.06s ease;
    color: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .answer-btn:active { transform: scale(0.97); }
  .btn-odd { background: var(--odd); }
  .btn-even { background: var(--even); }

  /* ============ END ============ */
  #end-screen { justify-content: space-between; }

  .end-header {
    margin-top: 8vh;
  }
  .end-eyebrow {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .end-headline {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(42px, 11vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  /* Trophy appears inline at the end of the headline when a row record breaks */
  .end-headline.new-best-row::after {
    content: ' 🏆';
    font-size: 0.55em;
    vertical-align: 0.15em;
  }
  .end-footer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 14px;
    margin-bottom: 28px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 32px;
    padding: 20px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  /* NEW BEST tag — a small accent that appears next to the SCORE label
     when a personal best score is broken on this run. */
  .stat-label.new-best::after {
    content: ' 🏆';
    margin-left: 4px;
  }
  .stat-value {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 26px;
    line-height: 1;
  }

  .grid-section {
    margin-top: 24px;
  }

  .end-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .action-btn {
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.05em;
    padding: 18px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.1s ease;
  }
  .action-btn:active { transform: scale(0.98); }
  .action-btn.primary {
    background: var(--paper);
    color: var(--bg);
    border-color: var(--paper);
  }
  .action-btn.copied {
    background: var(--even);
    color: var(--bg);
    border-color: var(--even);
  }

  .come-back {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 12px;
    margin-bottom: 4px;
    line-height: 1.5;
  }

  /* Studio credit: small attribution at the bottom of the end screen,
     framed like an old film-studio mark. The robot logo sits above the
     studio name in a vertical lockup. */
  .studio-credit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    margin-bottom: 8px;
    opacity: 0.65;
  }
  .studio-logo {
    width: 56px;
    height: auto;
    display: block;
    filter: invert(1) brightness(0.95);  /* render the dark-ink robot in cream on dark bg */
  }
  .studio-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--dim);
    text-align: center;
  }

  /* Both grids are visually identical: GRID_COLS columns wide, same
     gaps, same square style. The play-grid sits absolutely behind the
     equation and is blurred; the end-grid is sharp and in document
     flow. At end-time the blur lifts and the visual handoff is seamless. */
  .square-grid,
  .play-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
  }
  .grid-square {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--rule);
  }
  .grid-square[data-state="correct"] { background: var(--even); }
  .grid-square[data-state="wrong"]   { background: var(--odd);  }

  /* Play-grid: absolutely positioned behind the equation, blurred.
     Sized to match the end-grid's typical width so the squares look
     the same size in both states. */
  .play-grid {
    position: absolute;
    top: 50px;
    left: 12px;
    right: 12px;
    z-index: 0;
    filter: blur(8px);
    opacity: 0.5;
    pointer-events: none;
    transition: filter 0.6s ease, opacity 0.6s ease;
    align-content: start;
  }
  .play-grid .grid-square {
    transform: scale(0);
    animation: squarePop 0.3s ease-out forwards;
  }
  @keyframes squarePop {
    0%   { transform: scale(0.3); }
    60%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* End reveal: blur lifts. The squares stay put; only sharpness changes. */
  .play-grid.revealed {
    filter: blur(0);
    opacity: 1;
  }

  /* Question floats above the blurred backdrop */
  .question { position: relative; z-index: 1; }

  /* Brief bloom beat: equation fades as the play-grid resolves */
  #play-screen.ending .question {
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #play-screen.ending .answer-btn {
    opacity: 0.3;
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <section class="screen active" id="start-screen">
    <div class="title-block">
      <div class="title">
        <div class="fudgy-word">Fudgy</div>
        <div class="maths-word">Maths<span class="beta-tag">BETA</span></div>
      </div>
      <div class="subtitle">
        An <span class="odd-mini">Odd</span> or <span class="even-mini">Even</span> Game
      </div>
    </div>
    <div>
      <div class="mode-toggle" role="tablist" aria-label="Game mode">
        <button class="mode-btn active" id="mode-daily" data-mode="daily">Daily</button>
        <button class="mode-btn" id="mode-practice" data-mode="practice">Practice</button>
      </div>
      <button class="start-btn" id="start-btn">Start →</button>
      <div class="start-foot">
        <span id="foot-left">No. <span id="daily-number">—</span></span>
        <span>:60</span>
      </div>
    </div>
  </section>

  <!-- PLAY SCREEN -->
  <section class="screen" id="play-screen">
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="timer-value">60</span>
      </div>
      <div class="hud-item">
        <span class="hud-label" style="text-align:right">Score</span>
        <span class="hud-value score" id="score-value">0</span>
      </div>
    </div>
    <div class="timer-bar"><div class="timer-bar-fill" id="timer-fill"></div></div>

    <div class="question-area">
      <div class="play-grid" id="play-grid"></div>
      <div class="question" id="question">7</div>
    </div>

    <div class="answer-row" id="answer-row">
      <button class="answer-btn btn-odd" data-answer="odd" id="btn-left">Odd</button>
      <button class="answer-btn btn-even" data-answer="even" id="btn-right">Even</button>
    </div>
  </section>

  <!-- END SCREEN -->
  <section class="screen" id="end-screen">
    <div class="end-header">
      <div class="end-eyebrow">Time's up</div>
      <div class="end-headline" id="end-headline">You made row 1!</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label" id="stat-score-label">Score</div>
          <div class="stat-value" id="stat-score">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Correct</div>
          <div class="stat-value" id="stat-correct">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Wrong</div>
          <div class="stat-value" id="stat-wrong">0</div>
        </div>
      </div>

      <div class="grid-section">
        <div class="square-grid" id="square-grid"></div>
        <div class="end-footer" id="end-footer">FUDGY MATHS</div>
      </div>
    </div>

    <div class="end-actions" id="end-actions-row">
      <button class="action-btn" id="again-btn">Again</button>
      <button class="action-btn primary" id="share-btn">Share your grid</button>
    </div>
    <div class="come-back" id="come-back" hidden>
      Come back tomorrow for a new Fudgy Maths!
    </div>

<script>
(function(){
  // ============ CONFIG ============
  // Row width for both the visible play-grid, the end-screen grid, and
  // the shareable emoji grid. Single source of truth so changing this
  // affects everything consistently.
  const GRID_COLS = 8;

  // ============ STATE ============
  const state = {
    score: 0,
    correct: 0,
    wrong: 0,
    streak: 0,
    bestStreak: 0,
    timeLeft: 60,
    totalDuration: 60,    // mutable: grows with perfect-row bonuses
    history: [],          // array of true/false, every answer this run
    fullHistory: [],      // every answer for stats
    currentAnswer: null,  // 'odd' | 'even'
    timerInterval: null,
    startTime: 0,
    mode: 'daily',        // 'daily' | 'practice'
    rng: Math.random,     // replaced with seeded RNG in daily mode
    dailyNumber: 0,
    dailyKey: '',
    questionIndex: 0,     // 0-based question count for fixed-length bands
  };

  // ============ SEEDED RNG (mulberry32) ============
  // Daily mode uses a deterministic sequence so everyone playing today
  // gets the same questions in the same order.
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Hash a string into a 32-bit seed (xfnv1a)
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    }
    return h >>> 0;
  }

  // Days since launch epoch — used as the daily puzzle number.
  const LAUNCH_EPOCH = new Date('2026-05-02T00:00:00').getTime();
  function getDailyKey() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  function getDailyNumber() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.floor((today.getTime() - LAUNCH_EPOCH) / 86400000) + 1;
  }

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const screens = {
    start: $('start-screen'),
    play: $('play-screen'),
    end: $('end-screen'),
  };
  const showScreen = name => {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    // Lock the page to viewport during play; let it scroll on start/end
    document.body.classList.toggle('play-active', name === 'play');
    if (name !== 'play') window.scrollTo(0, 0);
  };

  // ============ STATS (personal bests via localStorage) ============
  // Tracks two records: best daily score and best daily row reached.
  // Practice runs are NOT tracked — they're unlimited replays, so
  // recording them would trivialize the records. Practice is practice.
  const STATS_KEY = 'fudgy-maths-stats-v2';
  const stats = {
    load() {
      try {
        const raw = localStorage.getItem(STATS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* fall through */ }
      return { daily: { bestScore: null, bestRow: null } };
    },
    save(data) {
      try { localStorage.setItem(STATS_KEY, JSON.stringify(data)); }
      catch (e) { /* localStorage unavailable — silently no-op */ }
    },
    // Compare a finished run against stored bests. Returns flags telling
    // the end screen which records (if any) were newly broken on this run.
    record(mode, score, row) {
      if (mode !== 'daily') return { newBestScore: false, newBestRow: false };
      const data = this.load();
      const bucket = data.daily;
      const flags = { newBestScore: false, newBestRow: false };
      if (bucket.bestScore === null || score > bucket.bestScore) {
        bucket.bestScore = score;
        flags.newBestScore = true;
      }
      if (bucket.bestRow === null || row > bucket.bestRow) {
        bucket.bestRow = row;
        flags.newBestRow = true;
      }
      this.save(data);
      return flags;
    },
  };

  // ============ QUESTION GENERATOR ============
  // Six bands, compressed at the front so players reach the inventive
  // territory (mixed-mode, fractions, dice operations, multi-step) faster.
  // Reaching band 6 still requires ~50 correct answers — elite, but
  // achievable for fast players. Wrong answers do NOT advance the
  // questionIndex, so depth is genuinely earned.
  //
  //   B1 (Q  1-5):   single digit, tiny novelty sprinkles    [ 5 questions]
  //   B2 (Q  6-13):  add/sub backbone, two-operand variants  [ 8 questions]
  //   B3 (Q 14-22):  multiplication, doubling, squares       [ 9 questions]
  //   B4 (Q 23-35):  squares, division, mixed-mode arrives   [13 questions]
  //   B5 (Q 36-50):  multi-step, fraction-plus, dice × arabic[15 questions]
  //   B6 (Q 51+):    cubes, big squares, n³ ± c              [elite tier]
  const BAND_RANGES = [
    { band: 1, start: 0,  end: 5  },   // Q 1-5
    { band: 2, start: 5,  end: 13 },   // Q 6-13
    { band: 3, start: 13, end: 22 },   // Q 14-22
    { band: 4, start: 22, end: 35 },   // Q 23-35
    { band: 5, start: 35, end: 50 },   // Q 36-50
    { band: 6, start: 50, end: Infinity },
  ];
  const TOTAL_BANDS = 6;
  function bandFor(qIndex) {
    for (const r of BAND_RANGES) {
      if (qIndex >= r.start && qIndex < r.end) return r.band;
    }
    return TOTAL_BANDS;
  }
  function subProgress(qIndex) {
    // 0.0 at the start of the band, ~1.0 by the end
    const r = BAND_RANGES.find(r => qIndex >= r.start && qIndex < r.end) || BAND_RANGES[BAND_RANGES.length - 1];
    if (r.end === Infinity) {
      // Band 6 has no upper bound — ramp over its first 14 questions
      return Math.min(1, (qIndex - r.start) / 14);
    }
    return (qIndex - r.start) / (r.end - r.start);
  }

  const rand = (min, max) => Math.floor(state.rng() * (max - min + 1)) + min;
  const pick = arr => arr[Math.floor(state.rng() * arr.length)];

  // Pre-baked clean-division pairs so the result is always whole.
  const DIVISIONS = [];
  for (let div = 2; div <= 9; div++) {
    for (let q = 2; q <= 12; q++) {
      DIVISIONS.push([div * q, div]);
    }
  }

  // Number-word lookup for spelled-out equations. Up to 20 covers every
  // operand we need without making the equation text overrun the display.
  const WORDS = [
    'zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven',
    'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen',
    'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'
  ];
  const word = n => WORDS[n] || String(n);

  // Roman numeral conversion, capped by row. Higher rows allow larger
  // numerals; the cap is the design knob for how punishing the format
  // becomes. Subtractive notation (IV, IX, XIV, XIX) is the cognitive
  // speed bump that makes Roman numerals feel hard.
  const ROMAN_TABLE = [
    [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']
  ];
  function toRoman(n) {
    let out = '';
    let r = n;
    for (const [val, sym] of ROMAN_TABLE) {
      while (r >= val) { out += sym; r -= val; }
    }
    return out;
  }

  // Pool of count-friendly emoji. Each renders distinctly enough at
  // small sizes that a player can count them quickly. Cap question
  // length at 10 so the equation never overruns the display.
  const COUNT_EMOJI = ['🕺', '🐱', '🍕', '🚀', '🌟', '🦄', '🎈', '🍩', '👻', '🐢'];

  // Dice faces 1-6. Unicode "Game Dice" block, well-supported on modern
  // phones (iOS, Android Chrome, recent desktop browsers). Indexed 1-6
  // so DICE[1] is the one-pip face, DICE[6] is the six-pip face.
  const DICE = [null, '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

  // Clock faces 1 o'clock through 12 o'clock. On-the-hour only — half-
  // hour glyphs exist but represent fractional values (1.5, 2.5...) which
  // don't fit parity. Indexed 1-12 so CLOCK[1] is 🕐 and CLOCK[12] is 🕛.
  const CLOCK = [null,
    '🕐', '🕑', '🕒', '🕓', '🕔', '🕕',
    '🕖', '🕗', '🕘', '🕙', '🕚', '🕛'
  ];

  // Hand emoji where the raised-finger count encodes the value. Limited
  // to three unambiguous gestures — others (✋ 🤘 🤞 etc.) carry strong
  // cultural meanings that compete with the number reading. Adds a
  // human/warm presence to the game's otherwise abstract formats.
  const HAND = [
    ['☝️', 1], ['✌️', 2], ['🖐', 5],
  ];

  // Question shape generators — each returns {text, value}. Kept as
  // small functions so bands can compose them with weighted picks.
  const shapes = {
    single: () => {
      const n = rand(1, 9);
      return { text: String(n), value: n };
    },
    addSmall: () => {
      const a = rand(2, 9), b = rand(2, 9);
      return { text: `${a} + ${b}`, value: a + b };
    },
    addBig: () => {
      const a = rand(5, 18), b = rand(5, 18);
      return { text: `${a} + ${b}`, value: a + b };
    },
    subSmall: () => {
      const a = rand(8, 18), b = rand(1, 7);
      return { text: `${a} − ${b}`, value: a - b };
    },
    subBig: () => {
      const a = rand(15, 35), b = rand(3, 14);
      return { text: `${a} − ${b}`, value: a - b };
    },
    multSmall: () => {
      const a = rand(2, 6), b = rand(2, 6);
      return { text: `${a} × ${b}`, value: a * b };
    },
    multBig: () => {
      const a = rand(3, 9), b = rand(3, 9);
      return { text: `${a} × ${b}`, value: a * b };
    },
    doubling: () => {
      const n = rand(7, 25);
      return { text: `2 × ${n}`, value: 2 * n };
    },
    sqSmall: () => {
      const n = rand(3, 7);
      return { text: `${n}²`, value: n * n };
    },
    sqMid: () => {
      const n = rand(6, 11);
      return { text: `${n}²`, value: n * n };
    },
    sqBig: () => {
      const n = rand(10, 12);
      return { text: `${n}²`, value: n * n };
    },
    division: () => {
      const [num, den] = pick(DIVISIONS);
      return { text: `${num} ÷ ${den}`, value: num / den };
    },
    threeOp: () => {
      const a = rand(10, 25), b = rand(5, 15), c = rand(3, 12);
      return { text: `${a} + ${b} − ${c}`, value: a + b - c };
    },
    multPlus: () => {
      const a = rand(3, 9), b = rand(2, 9), c = rand(1, 9);
      return { text: `${a} × ${b} + ${c}`, value: a * b + c };
    },
    multMinus: () => {
      const a = rand(3, 9), b = rand(2, 9), c = rand(1, 9);
      return { text: `${a} × ${b} − ${c}`, value: a * b - c };
    },
    sqOffset: () => {
      const n = rand(4, 9), c = rand(1, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      return { text: `${n}² ${op} ${c}`, value: op === '+' ? n * n + c : n * n - c };
    },
    divOffset: () => {
      const [num, den] = pick(DIVISIONS);
      const c = rand(1, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      return { text: `${num} ÷ ${den} ${op} ${c}`, value: op === '+' ? (num / den) + c : (num / den) - c };
    },
    tripleMult: () => {
      const a = rand(2, 6), b = rand(2, 6), c = rand(2, 6);
      return { text: `${a} × ${b} × ${c}`, value: a * b * c };
    },
    cube: () => {
      const n = rand(2, 5);
      return { text: `${n}³`, value: n * n * n };
    },
    cubeOffset: () => {
      const n = rand(2, 5), c = rand(1, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      return { text: `${n}³ ${op} ${c}`, value: op === '+' ? n * n * n + c : n * n * n - c };
    },

    // ===== SPELLED-OUT EQUATIONS =====
    // Same arithmetic as small/medium addition or subtraction, but
    // operands rendered as English words. Cognitive cost is the reading,
    // not the math. Tiny variant unlocked at row 2; fuller versions at row 3+.
    spelledAddTiny: () => {
      // Single-digit operands only. Easiest possible spelled equation.
      const a = rand(1, 5), b = rand(1, 4);
      return { text: `${word(a)} plus ${word(b)}`, value: a + b };
    },
    spelledAdd: () => {
      const a = rand(2, 9), b = rand(2, 9);
      return { text: `${word(a)} plus ${word(b)}`, value: a + b };
    },
    spelledSub: () => {
      const a = rand(8, 15), b = rand(1, 7);
      return { text: `${word(a)} minus ${word(b)}`, value: a - b };
    },
    spelledThree: () => {
      const a = rand(2, 6), b = rand(2, 6), c = rand(1, 4);
      return { text: `${word(a)} plus ${word(b)} plus ${word(c)}`, value: a + b + c };
    },

    // ===== EMOJI COUNT =====
    // Pick a single emoji and repeat it n times. Player counts the
    // glyphs to determine parity. Tiny variant (2-5) at row 2; fuller
    // 2-10 range at row 3+; subtraction variant at row 4+.
    emojiCountTiny: () => {
      // Just 2-5 emojis. Glance-and-count quick.
      const n = rand(2, 5);
      const e = pick(COUNT_EMOJI);
      return { text: e.repeat(n), value: n };
    },
    emojiCount: () => {
      const n = rand(2, 10);
      const e = pick(COUNT_EMOJI);
      return { text: e.repeat(n), value: n };
    },
    // Same idea but with a small subtraction: "🐱🐱🐱🐱🐱 − 2"
    // Read the emoji count, subtract the number, decide parity.
    emojiMinus: () => {
      const n = rand(4, 10), c = rand(1, 3);
      const e = pick(COUNT_EMOJI);
      return { text: `${e.repeat(n)} − ${c}`, value: n - c };
    },

    // ===== ROMAN NUMERALS =====
    // Cap parameter controls how big the numerals get. Smaller caps
    // mean simpler numerals (fewer subtractive forms, shorter strings).
    // Each row has its own cap; see the band logic below.
    // Tiny variant (cap V) at row 3 introduces the format gently —
    // only I, II, III, IV, V appear, with just one subtractive form.
    romanAddTiny: () => {
      const a = rand(1, 5), b = rand(1, 5);
      return { text: `${toRoman(a)} + ${toRoman(b)}`, value: a + b };
    },
    romanAdd: (cap = 8) => {
      const a = rand(1, cap), b = rand(1, cap);
      return { text: `${toRoman(a)} + ${toRoman(b)}`, value: a + b };
    },
    romanSub: (cap = 8) => {
      // Ensure non-negative: a >= b
      const a = rand(2, cap);
      const b = rand(1, Math.max(1, a - 1));
      return { text: `${toRoman(a)} − ${toRoman(b)}`, value: a - b };
    },
    // Roman multiplication. Same Roman cap concept but multiplication
    // of small Roman numerals. Tiny variant (cap III, so just I-III)
    // unlocks gently before fuller cap V at row 5+.
    romanMultTiny: () => {
      const a = rand(2, 3), b = rand(2, 3);
      return { text: `${toRoman(a)} × ${toRoman(b)}`, value: a * b };
    },
    romanMult: (cap = 5) => {
      const a = rand(2, cap), b = rand(2, cap);
      return { text: `${toRoman(a)} × ${toRoman(b)}`, value: a * b };
    },

    // Spelled-out multiplication. Tiny variant uses 2×2 to 3×3, full
    // version uses 2-9 × 2-9.
    spelledMultTiny: () => {
      const a = rand(2, 3), b = rand(2, 3);
      return { text: `${word(a)} times ${word(b)}`, value: a * b };
    },
    spelledMult: () => {
      const a = rand(2, 6), b = rand(2, 6);
      return { text: `${word(a)} times ${word(b)}`, value: a * b };
    },

    // ===== FRACTIONS =====
    // Always resolve to a whole number — we never give the player a
    // fractional result they have to interpret. Tiny variant (divisor 2,
    // small numerators) introduces the format; full version uses larger
    // numerators and divisors up to 5.
    fractionTiny: () => {
      // numerator/2 where numerator is 4-12 even — always clean.
      const den = 2;
      const q = rand(2, 6);  // quotient
      const num = q * den;
      return { text: `${num}/${den}`, value: q };
    },
    fraction: () => {
      const den = rand(2, 5);
      const q = rand(2, 9);
      const num = q * den;
      return { text: `${num}/${den}`, value: q };
    },
    fractionPlus: () => {
      // Fraction + small offset — bridges to mid-game complexity.
      const den = rand(2, 4);
      const q = rand(2, 8);
      const num = q * den;
      const c = rand(1, 6);
      const op = state.rng() < 0.5 ? '+' : '−';
      const value = op === '+' ? q + c : q - c;
      return { text: `${num}/${den} ${op} ${c}`, value };
    },

    // ===== DICE =====
    // Single die: just count pips. Two dice: sum the pips. Dice in
    // equations: dice + arabic, etc. The pip-counting itself is fast
    // (one die is 1-6); the difficulty scales with combination count.
    diceSolo: () => {
      const n = rand(1, 6);
      return { text: DICE[n], value: n };
    },
    dicePair: () => {
      const a = rand(1, 6), b = rand(1, 6);
      return { text: `${DICE[a]} ${DICE[b]}`, value: a + b };
    },
    diceTrio: () => {
      const a = rand(1, 6), b = rand(1, 6), c = rand(1, 6);
      return { text: `${DICE[a]} ${DICE[b]} ${DICE[c]}`, value: a + b + c };
    },
    dicePlusArabic: () => {
      const a = rand(1, 6), b = rand(2, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      // Avoid negative results
      const value = op === '+' ? a + b : Math.max(0, a - b);
      const safeOp = (op === '−' && a < b) ? '+' : op;
      return { text: `${DICE[a]} ${safeOp} ${b}`, value: safeOp === '+' ? a + b : a - b };
    },
    diceTimesArabic: () => {
      const a = rand(2, 6), b = rand(2, 6);
      return { text: `${DICE[a]} × ${b}`, value: a * b };
    },

    // ===== CLOCKS =====
    // Clock faces work like dice but with hour-position values 1-12.
    // Slightly harder to read than dice (some hand positions are
    // similar at small sizes), so they enter the band progression
    // one row later than dice.
    clockSolo: () => {
      const n = rand(1, 12);
      return { text: CLOCK[n], value: n };
    },
    clockPair: () => {
      // Unlike dice, two clocks side by side don't read as a sum — they
      // could be 4:35 or anything else. Always include an explicit
      // operator. Subtraction is ordered to ensure non-negative result.
      const op = state.rng() < 0.5 ? '+' : '−';
      if (op === '+') {
        const a = rand(1, 12), b = rand(1, 12);
        return { text: `${CLOCK[a]} + ${CLOCK[b]}`, value: a + b };
      } else {
        const a = rand(2, 12), b = rand(1, a);
        return { text: `${CLOCK[a]} − ${CLOCK[b]}`, value: a - b };
      }
    },
    clockPlusArabic: () => {
      const a = rand(1, 12), b = rand(2, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      // Avoid negative results
      const opSafe = (op === '−' && a < b) ? '+' : op;
      const value = opSafe === '+' ? a + b : a - b;
      return { text: `${CLOCK[a]} ${opSafe} ${b}`, value };
    },
    clockTimesArabic: () => {
      // Cap clock at 6 to keep result manageable; clock × 5 = 30 max.
      const a = rand(2, 6), b = rand(2, 5);
      return { text: `${CLOCK[a]} × ${b}`, value: a * b };
    },

    // ===== MIXED-MODE EQUATIONS =====
    // One operand is in an alternate format (Roman or spelled), the
    // other is a normal Arabic numeral. Forces a mid-equation mode
    // switch. Limited to 2-mode mixes for legibility.
    mixedRomanArabic: (cap = 13) => {
      const a = rand(1, cap), b = rand(2, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      // Randomize which side gets which mode
      const romanFirst = state.rng() < 0.5;
      const left  = romanFirst ? toRoman(a) : String(b);
      const right = romanFirst ? String(b)  : toRoman(a);
      const value = romanFirst
        ? (op === '+' ? a + b : a - b)
        : (op === '+' ? b + a : b - a);
      // Avoid negative results — flip operator if needed
      if (value < 0) {
        return { text: `${left} + ${right}`, value: a + b };
      }
      return { text: `${left} ${op} ${right}`, value };
    },
    mixedSpelledArabic: () => {
      const a = rand(2, 9), b = rand(2, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      const wordFirst = state.rng() < 0.5;
      const left  = wordFirst ? word(a) : String(b);
      const right = wordFirst ? String(b) : word(a);
      const value = wordFirst
        ? (op === '+' ? a + b : a - b)
        : (op === '+' ? b + a : b - a);
      if (value < 0) {
        return { text: `${left} plus ${right}`, value: a + b };
      }
      const opWord = op === '+' ? 'plus' : 'minus';
      return { text: `${left} ${opWord} ${right}`, value };
    },

    // ===== HALVING (sibling to doubling) =====
    halving: () => {
      const q = rand(5, 25);
      return { text: `${q * 2} ÷ 2`, value: q };
    },

    // ===== DOUBLING IN OTHER FORMATS =====
    spelledDoubling: () => {
      const n = rand(7, 19);
      return { text: `two times ${word(n)}`, value: 2 * n };
    },
    romanDoubling: () => {
      // n in 3-12; written as "2 × <Roman>" so the Arabic doubler is
      // always the explicit operator, the Roman is the operand.
      const n = rand(3, 12);
      return { text: `2 × ${toRoman(n)}`, value: 2 * n };
    },

    // ===== MORE DICE =====
    diceSubtract: () => {
      // Ensure non-negative result by ordering operands
      const a = rand(2, 6), b = rand(1, a);
      return { text: `${DICE[a]} − ${DICE[b]}`, value: a - b };
    },
    dicePairPlusArabic: () => {
      const a = rand(1, 6), b = rand(1, 6), c = rand(1, 6);
      return { text: `${DICE[a]} + ${DICE[b]} + ${c}`, value: a + b + c };
    },
    diceSquared: () => {
      const n = rand(2, 6);
      return { text: `${DICE[n]}²`, value: n * n };
    },

    // ===== FRACTION EXPANSIONS =====
    fractionRoman: () => {
      // Roman numerator over Arabic divisor — clean whole result
      const den = 2;
      const q = rand(2, 6);
      const num = q * den;  // <= 12, so toRoman gives at most XII
      return { text: `${toRoman(num)}/${den}`, value: q };
    },
    fractionTimes: () => {
      const den = rand(2, 4);
      const q = rand(2, 6);
      const num = q * den;
      const c = rand(2, 5);
      return { text: `${num}/${den} × ${c}`, value: q * c };
    },
    fractionPlusFraction: () => {
      const d1 = rand(2, 4), d2 = rand(2, 4);
      const q1 = rand(2, 6), q2 = rand(2, 6);
      return { text: `${q1 * d1}/${d1} + ${q2 * d2}/${d2}`, value: q1 + q2 };
    },

    // ===== SPELLED EXPANSIONS =====
    spelledTripleMult: () => {
      const a = rand(2, 4), b = rand(2, 4), c = rand(2, 3);
      return { text: `${word(a)} times ${word(b)} times ${word(c)}`, value: a * b * c };
    },
    spelledSquare: () => {
      const n = rand(3, 8);
      return { text: `${word(n)} squared`, value: n * n };
    },
    spelledCube: () => {
      const n = rand(2, 4);
      return { text: `${word(n)} cubed`, value: n * n * n };
    },

    // ===== ROMAN EXPANSIONS =====
    romanSquare: () => {
      const n = rand(2, 7);  // result up to 49, but only the Roman is shown
      return { text: `${toRoman(n)}²`, value: n * n };
    },
    romanCube: () => {
      const n = rand(2, 4);
      return { text: `${toRoman(n)}³`, value: n * n * n };
    },
    romanTriple: () => {
      // Three Roman numerals summed. Cap kept low to control width.
      const cap = 8;
      const a = rand(1, cap), b = rand(1, cap), c = rand(1, cap);
      return { text: `${toRoman(a)} + ${toRoman(b)} + ${toRoman(c)}`, value: a + b + c };
    },

    // ===== MORE MIXED-MODE =====
    mixedRomanSpelled: () => {
      // Roman + spelled (no Arabic). Two formats but neither is "plain."
      const a = rand(1, 9), b = rand(2, 9);
      const op = state.rng() < 0.5 ? 'plus' : 'minus';
      const romanFirst = state.rng() < 0.5;
      const left  = romanFirst ? toRoman(a) : word(b);
      const right = romanFirst ? word(b)    : toRoman(a);
      const value = romanFirst
        ? (op === 'plus' ? a + b : a - b)
        : (op === 'plus' ? b + a : b - a);
      if (value < 0) {
        return { text: `${left} plus ${right}`, value: a + b };
      }
      return { text: `${left} ${op} ${right}`, value };
    },
    mixedDiceSpelled: () => {
      const a = rand(1, 6), b = rand(2, 9);
      const op = state.rng() < 0.5 ? 'plus' : 'minus';
      const value = op === 'plus' ? a + b : Math.abs(a - b);
      // Ensure dice on left for visual rhythm
      const opWord = (op === 'minus' && a < b) ? 'plus' : op;
      const finalValue = opWord === 'plus' ? a + b : a - b;
      return { text: `${DICE[a]} ${opWord} ${word(b)}`, value: finalValue };
    },
    mixedDiceRoman: () => {
      const a = rand(1, 6), b = rand(2, 9);
      const op = state.rng() < 0.5 ? '+' : '−';
      const opSafe = (op === '−' && a < b) ? '+' : op;
      const value = opSafe === '+' ? a + b : a - b;
      return { text: `${DICE[a]} ${opSafe} ${toRoman(b)}`, value };
    },
    mixedThreeOp: () => {
      // Three operands across mixed formats: Arabic + Roman + Arabic, or
      // Roman − Arabic + Arabic, etc. Constrained so result is non-negative.
      const a = rand(2, 9), b = rand(1, 8), c = rand(1, 6);
      // Patterns: a + R(b) + c | R(a) + b + c | a − R(b) + c (a > b)
      const r = state.rng();
      if (r < 0.34) {
        return { text: `${a} + ${toRoman(b)} + ${c}`, value: a + b + c };
      } else if (r < 0.67) {
        return { text: `${toRoman(a)} + ${b} + ${c}`, value: a + b + c };
      } else {
        // Subtraction variant — ensure a > b for non-negative
        const big = Math.max(a, b) + 1;
        const small = Math.min(a, b);
        return { text: `${big} − ${toRoman(small)} + ${c}`, value: big - small + c };
      }
    },

    // ===== HAND EMOJI (raised-finger count) =====
    // ☝️ = 1, ✌️ = 2, 🖐 = 5. Tiny corpus deliberately — only the three
    // most unambiguous gestures. Same rules as wordPrefix and shapeGlyph:
    // never used solo, always combined.

    handArabic: () => {
      const [h, n] = pick(HAND);
      const b = rand(2, 9);
      const ops = ['+', '−', '×'];
      const op = pick(ops);
      const opSafe = (op === '−' && n < b) ? '+' : op;
      let value;
      if (opSafe === '+') value = n + b;
      else if (opSafe === '−') value = n - b;
      else value = n * b;
      const handFirst = state.rng() < 0.5;
      const text = handFirst ? `${h} ${opSafe} ${b}` : `${b} ${opSafe} ${h}`;
      if (!handFirst && opSafe === '−') {
        if (b < n) return { text: `${b} + ${h}`, value: b + n };
        return { text, value: b - n };
      }
      return { text, value };
    },

    handThreeOp: () => {
      const [h, n] = pick(HAND);
      const b = rand(2, 8), c = rand(1, 6);
      const r = state.rng();
      if (r < 0.4) {
        return { text: `${h} + ${b} + ${c}`, value: n + b + c };
      } else if (r < 0.7) {
        if (n >= b) return { text: `${h} − ${b} + ${c}`, value: n - b + c };
        return { text: `${h} + ${b} + ${c}`, value: n + b + c };
      } else {
        return { text: `${b} + ${h} + ${c}`, value: b + n + c };
      }
    },
  };

  // Weighted pick from an [{shape, weight, args?}] list. The optional
  // `args` array gets spread into the shape generator — used by Roman
  // numeral shapes whose difficulty cap varies per row.
  function weightedPick(entries) {
    const total = entries.reduce((s, e) => s + e.weight, 0);
    let r = state.rng() * total;
    for (const e of entries) {
      r -= e.weight;
      if (r <= 0) return shapes[e.shape](...(e.args || []));
    }
    const last = entries[entries.length - 1];
    return shapes[last.shape](...(last.args || []));
  }

  // Linearly interpolate between an "easy" and "hard" weight set
  // based on subProgress (0.0 → 1.0 across the band). Matches entries
  // by shape name (and arg signature) so easy and hard pools can have
  // different shapes — a shape only present in `hard` ramps from 0 to
  // its full weight; a shape only in `easy` ramps from full weight to 0.
  function rampWeights(easy, hard, t) {
    const argKey = e => `${e.shape}::${(e.args || []).join(',')}`;
    const hardMap = new Map(hard.map(e => [argKey(e), e]));
    const easyMap = new Map(easy.map(e => [argKey(e), e]));
    const allKeys = new Set([...easyMap.keys(), ...hardMap.keys()]);
    const out = [];
    for (const k of allKeys) {
      const e = easyMap.get(k);
      const h = hardMap.get(k);
      const ref = e || h;  // at least one must exist
      const eW = e ? e.weight : 0;
      const hW = h ? h.weight : 0;
      const w = eW * (1 - t) + hW * t;
      if (w > 0) {
        out.push({ shape: ref.shape, weight: w, args: ref.args });
      }
    }
    return out;
  }

  function makeQuestion() {
    const band = bandFor(state.questionIndex);
    const t = subProgress(state.questionIndex);
    let q;

    if (band === 1) {
      // Row 1 — variety from the start. Numeric Arabic dominates so the
      // game feels familiar at first glance, but every "number-as-thing"
      // format (single die, tiny spelled, tiny emoji, tiny Roman) shows
      // up in sprinkles. Single-digit Arabic is the calm shape; everything
      // else is a tiny treat. By end of band, addition appears as the
      // bridge to band 2's two-operand world.
      const easy = [
        // Numeric backbone
        {shape:'single',         weight:8},
        {shape:'addSmall',       weight:0},
        // Variety sprinkles — all in their tiniest form
        {shape:'spelledAddTiny', weight:1},
        {shape:'emojiCountTiny', weight:1},
        {shape:'diceSolo',       weight:2},
        {shape:'romanAddTiny',   weight:1},
      ];
      const hard = [
        {shape:'single',         weight:3},
        {shape:'addSmall',       weight:5},
        {shape:'spelledAddTiny', weight:1},
        {shape:'emojiCountTiny', weight:2},
        {shape:'diceSolo',       weight:2},
        {shape:'romanAddTiny',   weight:1},
      ];
      q = weightedPick(rampWeights(easy, hard, t));

    } else if (band === 2) {
      // Row 2 — single-digit Arabic drops out (boring next to dice and
      // emoji). Two-operand variants of every format arrive: dice pair,
      // tiny spelled mult, tiny fraction, tiny numeric mult. Variety
      // share grows. Add/sub remains the dominant Arabic backbone.
      const easy = [
        // Arabic backbone
        {shape:'addSmall',       weight:5}, {shape:'subSmall',       weight:4},
        {shape:'addBig',         weight:1},
        // Format-variety sprinkles continue (raised from row 1)
        {shape:'spelledAddTiny', weight:2}, {shape:'emojiCountTiny', weight:2},
        {shape:'diceSolo',       weight:2}, {shape:'romanAddTiny',   weight:2},
        // Two-operand variants arrive in tiny form
        {shape:'dicePair',         weight:1},
        {shape:'spelledMultTiny',  weight:1},
        {shape:'fractionTiny',     weight:1},
        {shape:'multSmall',        weight:1},
        // New gentle expansions
        {shape:'halving',          weight:1},
        {shape:'spelledDoubling',  weight:1},
      ];
      const hard = [
        // Arabic backbone fades
        {shape:'addSmall',       weight:2}, {shape:'subSmall',       weight:2},
        {shape:'addBig',         weight:2},
        // Format variety grows
        {shape:'spelledAddTiny', weight:2}, {shape:'emojiCountTiny', weight:2},
        {shape:'diceSolo',       weight:1}, {shape:'romanAddTiny',   weight:2},
        // Two-operand variants more prominent
        {shape:'dicePair',         weight:2},
        {shape:'spelledMultTiny',  weight:1},
        {shape:'fractionTiny',     weight:1},
        {shape:'multSmall',        weight:2},
        // New gentle expansions persist
        {shape:'halving',          weight:1},
        {shape:'spelledDoubling',  weight:1},
        // Preview of band 3 content
        {shape:'spelledAdd',       weight:1},
        {shape:'emojiCount',       weight:1},
      ];
      q = weightedPick(rampWeights(easy, hard, t));

    } else if (band === 3) {
      // Row 3 — fuller versions of single-operand formats arrive:
      // spelled subtraction, full emoji counts, Roman subtraction (and
      // cap raises to VIII). Multiplication & doubling become a major
      // backbone. The "calm" shape is now multSmall, not single digits.
      const easy = [
        // Multiplication backbone
        {shape:'multSmall',     weight:4}, {shape:'doubling',     weight:3},
        {shape:'multBig',       weight:1},
        // Earlier shapes still recur for continuity
        {shape:'addBig',        weight:1}, {shape:'subSmall',     weight:1},
        {shape:'halving',       weight:1}, {shape:'spelledDoubling', weight:1},
        // Tiny variants persist as the "easy" novelty option
        {shape:'spelledAddTiny',weight:1}, {shape:'emojiCountTiny',weight:1},
        {shape:'diceSolo',      weight:1}, {shape:'romanAddTiny', weight:1},
        // Two-operand novelty
        {shape:'dicePair',         weight:2},
        {shape:'spelledMultTiny',  weight:1},
        {shape:'fractionTiny',     weight:1},
        // New band-3 expansions
        {shape:'romanDoubling',    weight:1},
        {shape:'diceSubtract',     weight:1},
        {shape:'clockSolo',        weight:1},
        {shape:'handArabic',       weight:2},
        // Fuller variants arriving
        {shape:'spelledAdd',       weight:1},
        {shape:'spelledSub',       weight:1},
        {shape:'emojiCount',       weight:1},
        {shape:'romanAdd',         weight:1, args:[8]},
        {shape:'romanSub',         weight:0, args:[8]},
        // Squares (preview of band 4)
        {shape:'sqSmall',          weight:0},
      ];
      const hard = [
        {shape:'multSmall',     weight:2}, {shape:'doubling',     weight:2},
        {shape:'multBig',       weight:2},
        {shape:'addBig',        weight:1}, {shape:'subSmall',     weight:1},
        {shape:'halving',       weight:1}, {shape:'spelledDoubling', weight:1},
        {shape:'spelledAddTiny',weight:1}, {shape:'emojiCountTiny',weight:1},
        {shape:'diceSolo',      weight:1}, {shape:'romanAddTiny', weight:1},
        {shape:'dicePair',         weight:2},
        {shape:'spelledMultTiny',  weight:1},
        {shape:'fractionTiny',     weight:1},
        // New band-3 expansions persist
        {shape:'romanDoubling',    weight:1},
        {shape:'diceSubtract',     weight:1},
        {shape:'clockSolo',        weight:1},
        {shape:'handArabic',       weight:2},
        // Fuller variants more prominent
        {shape:'spelledAdd',       weight:2},
        {shape:'spelledSub',       weight:2},
        {shape:'emojiCount',       weight:2},
        {shape:'romanAdd',         weight:2, args:[8]},
        {shape:'romanSub',         weight:2, args:[8]},
        {shape:'sqSmall',          weight:2},
      ];
      q = weightedPick(rampWeights(easy, hard, t));

    } else if (band === 4) {
      // Row 4 — first real complexity jumps: mixed-mode equations,
      // dice-trio sums, dice + arabic, full spelled mult, full fractions,
      // tiny Roman mult, squares, and division. Roman cap raises to XIII.
      // Plus a major expansion of cross-format mixed shapes — Roman with
      // spelled, dice with spelled, dice with Roman, and squares of
      // alternate formats.
      const easy = [
        // Squares & division
        {shape:'sqSmall',    weight:3}, {shape:'sqMid',     weight:2},
        {shape:'division',   weight:3}, {shape:'multBig',   weight:2},
        // Earlier shapes recur
        {shape:'doubling',     weight:1},
        {shape:'spelledAdd',   weight:1}, {shape:'emojiCount',  weight:1},
        {shape:'dicePair',     weight:1},
        {shape:'romanDoubling', weight:1}, {shape:'diceSubtract', weight:1},
        // Three-part shapes
        {shape:'threeOp',      weight:0},
        {shape:'spelledThree', weight:1},
        {shape:'diceTrio',     weight:1},
        {shape:'emojiMinus',   weight:1},
        // Mid-tier expansions
        {shape:'dicePlusArabic',   weight:2},
        {shape:'spelledMult',      weight:1},
        {shape:'fraction',         weight:1},
        {shape:'romanMultTiny',    weight:1},
        // New band-4 expansions
        {shape:'romanSquare',         weight:1},
        {shape:'spelledSquare',       weight:1},
        {shape:'fractionRoman',       weight:1},
        {shape:'romanTriple',         weight:1},
        {shape:'dicePairPlusArabic',  weight:1},
        {shape:'mixedRomanSpelled',   weight:1},
        {shape:'mixedDiceSpelled',    weight:1},
        {shape:'mixedDiceRoman',      weight:1},
        // Clock family expands
        {shape:'clockSolo',           weight:1},
        {shape:'clockPair',           weight:1},
        {shape:'clockPlusArabic',     weight:1},
        // Word/shape continue from band 3, plus cross-format combinations
        {shape:'handArabic',          weight:1},
        // Roman cap raises to XIII + mixed-mode
        {shape:'romanAdd',   weight:1, args:[13]},
        {shape:'romanSub',   weight:1, args:[13]},
        {shape:'mixedRomanArabic',   weight:2, args:[13]},
        {shape:'mixedSpelledArabic', weight:2},
      ];
      const hard = [
        {shape:'sqSmall',    weight:1}, {shape:'sqMid',     weight:3},
        {shape:'division',   weight:2}, {shape:'multBig',   weight:2},
        {shape:'doubling',     weight:1},
        {shape:'spelledAdd',   weight:1}, {shape:'emojiCount',  weight:1},
        {shape:'dicePair',     weight:1},
        {shape:'romanDoubling', weight:1}, {shape:'diceSubtract', weight:1},
        {shape:'threeOp',      weight:3},
        {shape:'spelledThree', weight:1},
        {shape:'diceTrio',     weight:1},
        {shape:'emojiMinus',   weight:1},
        {shape:'dicePlusArabic',   weight:2},
        {shape:'spelledMult',      weight:1},
        {shape:'fraction',         weight:1},
        {shape:'romanMultTiny',    weight:1},
        // New band-4 expansions persist
        {shape:'romanSquare',         weight:1},
        {shape:'spelledSquare',       weight:1},
        {shape:'fractionRoman',       weight:1},
        {shape:'romanTriple',         weight:1},
        {shape:'dicePairPlusArabic',  weight:1},
        {shape:'mixedRomanSpelled',   weight:1},
        {shape:'mixedDiceSpelled',    weight:1},
        {shape:'mixedDiceRoman',      weight:1},
        // Clock family persists
        {shape:'clockSolo',           weight:1},
        {shape:'clockPair',           weight:1},
        {shape:'clockPlusArabic',     weight:1},
        // Word/shape persist
        {shape:'handArabic',          weight:1},
        {shape:'romanAdd',   weight:1, args:[13]},
        {shape:'romanSub',   weight:1, args:[13]},
        {shape:'mixedRomanArabic',   weight:2, args:[13]},
        {shape:'mixedSpelledArabic', weight:1},
      ];
      q = weightedPick(rampWeights(easy, hard, t));

    } else if (band === 5) {
      // Row 5+ — multi-step territory. Combinations of operations:
      // multPlus, multMinus, fraction-with-offset, dice × arabic, Roman
      // multiplication, square offsets, division offsets. Roman cap
      // raises to XX.
      const easy = [
        {shape:'multPlus',   weight:4}, {shape:'multMinus',  weight:4},
        {shape:'tripleMult', weight:2}, {shape:'sqOffset',   weight:0},
        {shape:'divOffset',  weight:0}, {shape:'threeOp',    weight:1},
        // Earlier shapes recur
        {shape:'sqMid',          weight:1},
        {shape:'multBig',        weight:1},
        {shape:'fraction',       weight:1},
        {shape:'dicePlusArabic', weight:1},
        // New tougher variants
        {shape:'fractionPlus',     weight:1},
        {shape:'diceTimesArabic',  weight:1},
        {shape:'romanMult',        weight:1, args:[5]},
        // New band-5 expansions
        {shape:'diceSquared',          weight:1},
        {shape:'fractionTimes',        weight:1},
        {shape:'fractionPlusFraction', weight:1},
        {shape:'spelledTripleMult',    weight:1},
        {shape:'mixedThreeOp',         weight:1},
        // Word/shape three-operand arrives. Two-operand variants recur.
        {shape:'handArabic',           weight:1},
        {shape:'handThreeOp',          weight:1},
        // Clock family — multiplication arrives, earlier variants recur
        {shape:'clockPair',            weight:1},
        {shape:'clockPlusArabic',      weight:1},
        {shape:'clockTimesArabic',     weight:1},
        // Roman cap raises to XX
        {shape:'romanAdd',   weight:1, args:[20]},
        {shape:'romanSub',   weight:1, args:[20]},
        {shape:'mixedRomanArabic',   weight:1, args:[20]},
      ];
      const hard = [
        {shape:'multPlus',   weight:2}, {shape:'multMinus',  weight:2},
        {shape:'tripleMult', weight:2}, {shape:'sqOffset',   weight:3},
        {shape:'divOffset',  weight:3}, {shape:'threeOp',    weight:1},
        {shape:'sqMid',          weight:1},
        {shape:'multBig',        weight:1},
        {shape:'fraction',       weight:1},
        {shape:'dicePlusArabic', weight:1},
        {shape:'fractionPlus',     weight:2},
        {shape:'diceTimesArabic',  weight:1},
        {shape:'romanMult',        weight:1, args:[5]},
        // New band-5 expansions persist
        {shape:'diceSquared',          weight:1},
        {shape:'fractionTimes',        weight:1},
        {shape:'fractionPlusFraction', weight:1},
        {shape:'spelledTripleMult',    weight:1},
        {shape:'mixedThreeOp',         weight:1},
        // Word/shape persist
        {shape:'handArabic',           weight:1},
        {shape:'handThreeOp',          weight:1},
        {shape:'clockPair',            weight:1},
        {shape:'clockPlusArabic',      weight:1},
        {shape:'clockTimesArabic',     weight:1},
        {shape:'romanAdd',   weight:1, args:[20]},
        {shape:'romanSub',   weight:1, args:[20]},
        {shape:'mixedRomanArabic',   weight:1, args:[20]},
      ];
      q = weightedPick(rampWeights(easy, hard, t));

    } else {
      // Band 6 — the deep end. Cubes lead, with cube-offset arriving
      // late. Earlier novelty shapes recur as "calm" moments amid the
      // hard math, so the run still feels varied at the top. Roman and
      // spelled cubes appear as endgame curveballs.
      const easy = [
        {shape:'cube',       weight:4}, {shape:'sqBig',      weight:3},
        {shape:'multPlus',   weight:2}, {shape:'tripleMult', weight:1},
        {shape:'cubeOffset', weight:0},
        // Variety even at the deep end
        {shape:'fractionPlus',     weight:1},
        {shape:'diceTimesArabic',  weight:1},
        {shape:'diceSquared',      weight:1},
        {shape:'romanMult',        weight:1, args:[5]},
        {shape:'mixedRomanArabic', weight:1, args:[20]},
        // Endgame curveballs in alternate formats
        {shape:'romanCube',        weight:1},
        {shape:'spelledCube',      weight:1},
        {shape:'spelledTripleMult',weight:1},
        {shape:'mixedThreeOp',     weight:1},
        // Word/shape variety persists at the deep end
        {shape:'handThreeOp',      weight:1},
      ];
      const hard = [
        {shape:'cube',       weight:3}, {shape:'sqBig',      weight:2},
        {shape:'multPlus',   weight:1}, {shape:'tripleMult', weight:1},
        {shape:'cubeOffset', weight:3},
        {shape:'fractionPlus',     weight:1},
        {shape:'diceTimesArabic',  weight:1},
        {shape:'diceSquared',      weight:1},
        {shape:'romanMult',        weight:1, args:[5]},
        {shape:'mixedRomanArabic', weight:1, args:[20]},
        {shape:'romanCube',        weight:1},
        {shape:'spelledCube',      weight:1},
        {shape:'spelledTripleMult',weight:1},
        {shape:'mixedThreeOp',     weight:1},
        {shape:'handThreeOp',      weight:1},
      ];
      q = weightedPick(rampWeights(easy, hard, t));
    }

    return {
      text: q.text,
      answer: q.value % 2 === 0 ? 'even' : 'odd',
      band,
    };
  }

  // ============ GAME FLOW ============
  function startGame() {
    state.score = 0;
    state.correct = 0;
    state.wrong = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.timeLeft = 60;
    state.totalDuration = 60;
    state.history = [];
    state.fullHistory = [];
    state.recentTexts = [];
    state.startTime = Date.now();
    state.questionIndex = 0;

    // Seed RNG: deterministic for daily mode, random for practice
    if (state.mode === 'daily') {
      state.dailyKey = getDailyKey();
      state.dailyNumber = getDailyNumber();
      state.rng = mulberry32(hashSeed('odd-or-even-' + state.dailyKey));
    } else {
      state.rng = Math.random;
    }

    const playGrid = $('play-grid');
    playGrid.innerHTML = '';
    playGrid.classList.remove('revealed');
    updateHUD();
    nextQuestion();
    showScreen('play');

    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(tick, 100);
  }

  function tick() {
    const elapsed = (Date.now() - state.startTime) / 1000;
    state.timeLeft = Math.max(0, state.totalDuration - elapsed);
    const tv = $('timer-value');
    tv.textContent = Math.ceil(state.timeLeft);
    if (state.timeLeft <= 10) tv.classList.add('warn');
    else tv.classList.remove('warn');
    $('timer-fill').style.transform = `scaleX(${Math.min(1, state.timeLeft / 60)})`;
    if (state.timeLeft <= 0) endGame();
  }

  function nextQuestion() {
    // Avoid repeating any of the last 8 question texts. With ~70 generators
    // and combinatorial output, exact duplicates are statistically inevitable
    // over a run unless we filter — small-corpus generators (single digit,
    // dice solo, clocks) can produce the same text within seconds otherwise.
    // We try up to 8 times for a fresh equation; if all 8 attempts collide
    // (extremely rare), we fall through with whatever we got rather than
    // looping forever. This trades guaranteed uniqueness for guaranteed
    // termination — the right call.
    const recent = state.recentTexts || [];
    let q;
    for (let attempt = 0; attempt < 8; attempt++) {
      q = makeQuestion();
      if (!recent.includes(q.text)) break;
    }
    state.recentTexts = [...recent.slice(-7), q.text];
    state.currentAnswer = q.answer;
    const qEl = $('question');
    qEl.textContent = q.text;
    // Tag long equations so CSS can use a smaller font size — keeps
    // spelled-out and emoji-heavy equations from overflowing the screen.
    const len = q.text.length;
    if (len > 22)      qEl.dataset.len = 'xlong';
    else if (len > 12) qEl.dataset.len = 'long';
    else               qEl.dataset.len = '';
  }

  // Adds a colored square to the play-grid. The square is colored
  // immediately based on right/wrong, but the grid's heavy blur during
  // play abstracts those colors into atmospheric washes — the player
  // senses tone (greener = better) but can't actually read individual
  // squares until the bloom-up reveal.
  function addPlaySquare(correct) {
    const sq = document.createElement('div');
    sq.className = 'grid-square';
    sq.dataset.state = correct ? 'correct' : 'wrong';
    $('play-grid').appendChild(sq);
  }

  function handleAnswer(picked) {
    if (state.timeLeft <= 0) return;
    const correct = picked === state.currentAnswer;
    state.fullHistory.push(correct);
    state.history.push(correct);
    addPlaySquare(correct);

    if (correct) {
      state.score += 1;
      state.correct += 1;
      state.streak += 1;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      state.questionIndex += 1;  // depth is earned, not stumbled into
    } else {
      state.score -= 1;
      state.wrong += 1;
      state.streak = 0;
      // Shake the equation so the wrong tap is unmissable. Restart the
      // animation cleanly with a forced reflow in case of fast tapping.
      const qEl = $('question');
      qEl.classList.remove('shake');
      void qEl.offsetWidth;
      qEl.classList.add('shake');
    }

    updateHUD();
    nextQuestion();
  }

  function updateHUD() {
    $('score-value').textContent = state.score;
  }

  function endGame() {
    clearInterval(state.timerInterval);
    state.timerInterval = null;

    // Bloom the play-grid into focus. The squares were always there,
    // just blurred — now the blur lifts and the player sees their full
    // run resolve in real-time. The grid acts as a visual bridge from
    // play to end screen: same squares, same place, suddenly clear.
    $('play-screen').classList.add('ending');
    $('question').classList.remove('shake');
    $('play-grid').classList.add('revealed');

    setTimeout(() => {
      $('play-screen').classList.remove('ending');
      finalizeEnd();
    }, 800);
  }

  function finalizeEnd() {
    // Row reached = the grid row of the last square. Counts every tap
    // (right or wrong) so the headline matches what's visible in the grid.
    const totalAnswered = state.history.length;
    const highestTier = totalAnswered > 0
      ? Math.ceil(totalAnswered / GRID_COLS)
      : 1;

    // Headline suffix: reward perfection, gently call out brute-forcing.
    // "Poorly" triggers when wrong answers exceed 30% of total — that's
    // well past careful play and into button-mashing territory.
    const total = state.correct + state.wrong;
    const wrongRatio = total > 0 ? state.wrong / total : 0;
    let suffix = '';
    if (state.wrong === 0 && state.correct > 0) suffix = ' Perfectly 😎';
    else if (total >= 10 && wrongRatio > 0.3) suffix = ' Poorly 😅';

    $('end-headline').textContent = `You made row ${highestTier}!${suffix}`;
    $('stat-score').textContent = state.score;
    $('stat-correct').textContent = state.correct;
    $('stat-wrong').textContent = state.wrong;

    // Record this run against personal bests (localStorage). Daily only —
    // practice runs are unlimited, so recording them would trivialize the
    // record. Practice mode is genuinely just practice; no trophy chase.
    const flags = (state.mode === 'daily' && totalAnswered > 0)
      ? stats.record(state.mode, state.score, highestTier)
      : { newBestScore: false, newBestRow: false };
    $('stat-score-label').classList.toggle('new-best', flags.newBestScore);
    $('end-headline').classList.toggle('new-best-row', flags.newBestRow);
    // Populate the end-screen square grid with real DOM elements
    // matching the play-grid we just revealed. The squares are colored
    // identically; this is the "permanent" version on the end screen
    // that persists for the share moment.
    const sqGrid = $('square-grid');
    sqGrid.innerHTML = '';
    state.history.forEach(correct => {
      const sq = document.createElement('div');
      sq.className = 'grid-square';
      sq.dataset.state = correct ? 'correct' : 'wrong';
      // Skip the pop animation on the end screen — they're already
      // "alive," just fading in with the screen.
      sq.style.transform = 'scale(1)';
      sq.style.animation = 'none';
      sqGrid.appendChild(sq);
    });
    $('end-footer').textContent = state.mode === 'daily'
      ? `FUDGY MATHS №${state.dailyNumber}`
      : 'FUDGY MATHS';

    // Daily mode: re-label "Again" as "Try practice mode" so players can
    // jump into unlimited practice immediately. Come-back nudge sits below.
    // Practice mode keeps the plain "Again" label for instant replays.
    const againBtn = $('again-btn');
    const actionsRow = $('end-actions-row');
    const comeBack = $('come-back');
    if (state.mode === 'daily') {
      againBtn.textContent = 'Try practice mode';
      againBtn.hidden = false;
      actionsRow.style.gridTemplateColumns = '1fr 1fr';
      comeBack.hidden = false;
    } else {
      againBtn.textContent = 'Again';
      againBtn.hidden = false;
      actionsRow.style.gridTemplateColumns = '1fr 1fr';
      comeBack.hidden = true;
    }

    showScreen('end');
  }

  // Build a 2D grid: GRID_COLS squares per row. The final row is left
  // incomplete to honestly reflect where the buzzer caught you.
  function buildEmojiGrid() {
    if (state.history.length === 0) return '·····';
    const squares = state.history.map(c => c ? '🟩' : '🟥');
    const rows = [];
    for (let i = 0; i < squares.length; i += GRID_COLS) {
      rows.push(squares.slice(i, i + GRID_COLS).join(''));
    }
    return rows.join('\n');
  }

  // ============ SHARE ============
  // Three-tier fallback because artifact iframes sandbox both
  // navigator.share and navigator.clipboard:
  //   1. Web Share API (mobile browsers, top-level pages)
  //   2. Clipboard API (desktop, top-level secure pages)
  //   3. document.execCommand('copy') via hidden textarea (works everywhere)
  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function share() {
    const grid = buildEmojiGrid();
    const totalAnswered = state.history.length;
    const highestTier = totalAnswered > 0
      ? Math.ceil(totalAnswered / GRID_COLS)
      : 1;
    // Share version uses "I" instead of "You" — the player is now
    // the one telling the story, not being told it.
    const footer = state.mode === 'daily'
      ? `FUDGY MATHS №${state.dailyNumber}`
      : `FUDGY MATHS`;
    const total = state.correct + state.wrong;
    const wrongRatio = total > 0 ? state.wrong / total : 0;
    let suffix = '';
    if (state.wrong === 0 && state.correct > 0) suffix = ' Perfectly 😎';
    else if (total >= 10 && wrongRatio > 0.3) suffix = ' Poorly 😅';
    // Practice-mode shares are tagged in the headline so recipients know
    // not to compare against their daily.
    const modeTag = state.mode === 'practice' ? ' in practice mode' : '';
    const headline = `I made row ${highestTier}${modeTag}!${suffix}`;
    const text =
`${headline}

${state.score} pts · ✓ ${state.correct} · ✗ ${state.wrong}

${grid}

${footer}`;

    const btn = $('share-btn');
    let success = false;

    // Tier 1: Web Share (mobile)
    if (navigator.share) {
      try {
        await navigator.share({ text });
        success = true;
      } catch (e) {
        // User cancelled, or share blocked — fall through to clipboard
      }
    }

    // Tier 2: Clipboard API
    if (!success && navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        success = true;
      } catch (e) {
        // Permission denied (often in iframes) — fall through
      }
    }

    // Tier 3: legacy execCommand
    if (!success) {
      success = legacyCopy(text);
    }

    if (success) {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Share your grid';
        btn.classList.remove('copied');
      }, 1600);
    } else {
      // Last resort: show the text in a prompt so user can copy manually
      btn.textContent = 'Copy below ↓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Share your grid';
        btn.classList.remove('copied');
      }, 2400);
      window.prompt('Copy your result:', text);
    }
  }

  // ============ EVENTS ============
  $('start-btn').addEventListener('click', startGame);
  $('again-btn').addEventListener('click', () => {
    // From daily end screen, "Again" means "jump into practice mode."
    // From practice end screen, it means "replay practice."
    if (state.mode === 'daily') {
      state.mode = 'practice';
      // Update the start-screen toggle to reflect the new mode in case
      // the player exits later — keeps internal state consistent.
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === 'practice');
      });
    }
    startGame();
  });
  $('share-btn').addEventListener('click', share);

  // Mode toggle
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      updateStartFoot();
    });
  });

  function updateStartFoot() {
    const left = $('foot-left');
    if (state.mode === 'daily') {
      left.innerHTML = `No. <span id="daily-number">${getDailyNumber()}</span>`;
    } else {
      left.textContent = 'Free Play';
    }
  }
  updateStartFoot();

  // delegate answer taps via dataset.answer for clean event handling
  $('answer-row').addEventListener('click', e => {
    const btn = e.target.closest('.answer-btn');
    if (!btn) return;
    handleAnswer(btn.dataset.answer);
  });

  // keyboard support: ← / → or O / E
  document.addEventListener('keydown', e => {
    if (!screens.play.classList.contains('active')) return;
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'o') {
      handleAnswer($('btn-left').dataset.answer);
    } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'e') {
      handleAnswer($('btn-right').dataset.answer);
    }
  });
})();
</script>
